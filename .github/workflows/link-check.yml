name: Link Check

on:
  schedule:
    - cron: '0 18 * * 0'
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  link-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Run link check
        id: link_check
        continue-on-error: true
        run: npm run check:links
      - name: Commit generated link status
        if: always() && (github.ref_name == 'master' || github.ref_name == 'main')
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- data/generated/link-status.json
          if git diff --cached --quiet -- data/generated/link-status.json; then
            echo "link-status.json unchanged; no commit created"
          else
            git commit -m "chore: update link status"
            git push origin HEAD:"$GITHUB_REF_NAME"
          fi
      - name: Upload link check report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: link-check-report
          path: |
            reports/link-check.md
            data/generated/link-status.json
          if-no-files-found: ignore
      - name: Report invalid links
        if: steps.link_check.outcome == 'failure'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const title = '政务官网链接巡检发现失效链接';
            // Ensure the link-check label exists idempotently so the labeled lookup
            // and the new issue can reference it even on the very first run.
            await github.rest.issues.createLabel({
              owner: context.repo.owner,
              repo: context.repo.repo,
              name: 'link-check',
              color: 'd73a4a',
            }).catch((error) => {
              if (error.status !== 422) throw error;
            });
            const reportPath = 'reports/link-check.md';
            const report = fs.existsSync(reportPath)
              ? fs.readFileSync(reportPath, 'utf8')
              : '(报告未生成)';
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'link-check',
            });
            const existing = issues.find((issue) => issue.title === title);
            const body = `## 巡检结果\n\n${report}`;
            if (existing) {
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
                labels: ['link-check'],
              });
            }
